name: Refresh Railway evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: railway-evidence-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect sanitized Railway deployment metadata
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: python3 scripts/update_railway_status.py
      - name: Publish only when changed
        run: |
          if git diff --quiet -- railway-status.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add railway-status.json
          git commit -m "chore: refresh sanitized Railway evidence"
          # Another commit may land while the job runs. Replay ONLY the
          # snapshot commit on the latest main; never force-push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Railway snapshot published"
              exit 0
            fi
            # Conflicting snapshots can be regenerated on the next run.
            # Do not force-push or overwrite newer repository content.
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              echo "Snapshot conflict; keeping remote content unchanged"
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish after retries"
          exit 1
